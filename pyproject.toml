[project]
name = "rolematch"
version = "0.1.0"
description = "Evidence-based resume and job description matching"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "groq>=1.7.0",
    "pydantic>=2.14.2",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
rolematch = "rolematch.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
